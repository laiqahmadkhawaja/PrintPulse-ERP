<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Modern Printer + Laser / Pulse Beam -->
  <g transform="translate(10, 10)">
    <!-- Base Printer Body -->
    <rect x="15" y="45" width="70" height="35" rx="8" fill="#1e293b" />
    <!-- Paper Feed Tray -->
    <path d="M 27 45 L 27 20 L 73 20 L 73 45 Z" fill="#334155" />
    <line x1="33" y1="28" x2="67" y2="28" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="33" y1="36" x2="67" y2="36" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Output Paper -->
    <rect x="25" y="65" width="50" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="32" y1="73" x2="68" y2="73" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="80" x2="60" y2="80" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <!-- Dynamic Laser/Pulse Swoosh -->
    <path d="M 5 62 Q 22 25, 52 48 T 96 35" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="96" cy="35" r="4.5" fill="#f59e0b" />
    <!-- LED Indicators -->
    <circle cx="76" cy="53" r="2.5" fill="#10b981" />
    <circle cx="70" cy="53" r="2.5" fill="#0ea5e9" />
  </g>

  <!-- Typography -->
  <text x="125" y="65" font-family="'Segoe UI', 'Ubuntu', 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" fill="#0f172a" letter-spacing="-1">
    Print<tspan fill="url(#pGrad)">Pulse</tspan>
  </text>
  <rect x="365" y="34" width="60" height="24" rx="6" fill="#0ea5e9" />
  <text x="395" y="51" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRO</text>
  
  <text x="127" y="92" font-family="'Segoe UI', 'Noto Nastaliq Urdu', sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="0.5">
    MULTI-BUSINESS PRINTER &amp; ACCOUNTING ERP | ملٹی بزنس اکاؤنٹنگ
  </text>
</svg>